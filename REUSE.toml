version = 1

# Generated lock files cannot carry a header: Pipfile.lock is JSON, and
# the TOML locks are rewritten whole by their tools. A .python-version
# holds a version and nothing else.
[[annotations]]
path = [
  "tests/fixtures/*/*/*.lock",
  "tests/fixtures/*/*/.python-version",
]
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
