# Tool configuration only. This repository is a composite action, not a
# Python package, so there is deliberately no [project] or
# [build-system] table. The action never reads this file: it detects
# the caller's dependency files inside `path_prefix`, which is resolved
# against the caller's workspace, and the self-test points it at a
# separate `test-project` checkout.

[tool.basedpyright]
# No requires-python to follow, so this is the action's default
# `python_version` input, the interpreter setup-python provides.
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
# Scope a bare `basedpyright` run, and an editor's language server, to
# the same directories the pre-commit hook passes explicitly. tests/ is
# the only Python code in the repository.
include = ["tests"]
